---
layout: default
title: "{{ page.category }}"
category: {{ page.category }}
---

{% assign posts = site.posts | where: "category", page.category | where: "status", "published" %}

{% for post in posts %}
  <div class="post-card">
    <a href="{{ post.url }}">{{ post.title }}</a>
    <div class="meta">{{ post.date | date: "%d %b %Y" }}</div>
  </div>
{% endfor %}
